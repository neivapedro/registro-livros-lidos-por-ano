  <script>
    // Tema antes do CSS, para não piscar: Automático (segue o iPhone), Claro ou Escuro.
    // A escolha fica só neste aparelho ('leituras:tema'); a lógica é a mesma de js/theme.js.
    (function () {
      var pref = null;
      try { pref = localStorage.getItem('leituras:tema'); } catch (e) { /* sem armazenamento: automático */ }
      var light = pref === 'claro' || (pref !== 'escuro' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
      var theme = light ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', light ? '#F6F1EB' : '#0E0C0B');
      document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme);
    })();
  </script>
